# start with `docker compose up`
services:
  free-games-claimer:
    container_name: fgc # is printed in front of every output line
    image: sirus1985/free-games-claimer-with-mi-points # otherwise image name will be free-games-claimer-free-games-claimer
    build: .
    ports:
      # - "5900:5900" # VNC server
      - "6080:6080" # noVNC (browser-based VNC client)
    volumes:
      - fgc:/fgc/data
    command: bash -c "node mi-points"
    environment:
      # - EMAIL=foo@bar.org
      # - NOTIFY='tgram://...'
